<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Game Studio · 网页游戏编辑器</title>
<script src="https://cdn.jsdelivr.net/npm/jszip@3.10.1/dist/jszip.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/file-saver@2.0.5/dist/FileSaver.min.js"></script>
<link rel="stylesheet" href="css/style.css" />
</head>
<body>
<div class="app">
  <header class="topbar">
    <div class="brand">
      <div class="brand-logo">
        <svg viewBox="0 0 24 24" width="22" height="22">
          <rect x="3" y="5" width="18" height="14" rx="2" fill="none" stroke="currentColor" stroke-width="2"/>
          <circle cx="9" cy="12" r="1.6" fill="currentColor"/>
          <circle cx="15" cy="12" r="1.6" fill="currentColor"/>
        </svg>
      </div>
      <div class="brand-text">
        <div class="brand-title">Game Studio</div>
        <div class="brand-sub">可视化网页游戏编辑器</div>
      </div>
    </div>
    <div class="topbar-center">
      <div class="step-nav" id="stepNav">
        <div class="step active" data-step="1">
          <div class="step-num">1</div>
          <div class="step-label">新建项目</div>
        </div>
        <div class="step-line"></div>
        <div class="step" data-step="2">
          <div class="step-num">2</div>
          <div class="step-label">基础配置</div>
        </div>
        <div class="step-line"></div>
        <div class="step" data-step="3">
          <div class="step-num">3</div>
          <div class="step-label">数据编辑</div>
        </div>
        <div class="step-line"></div>
        <div class="step" data-step="4">
          <div class="step-num">4</div>
          <div class="step-label">地图编辑</div>
        </div>
        <div class="step-line"></div>
        <div class="step" data-step="5">
          <div class="step-num">5</div>
          <div class="step-label">动画制作</div>
        </div>
        <div class="step-line"></div>
        <div class="step" data-step="6">
          <div class="step-num">6</div>
          <div class="step-label">导出项目</div>
        </div>
      </div>
    </div>
    <div class="topbar-right">
      <div class="project-name" id="projectNameDisplay">未创建项目</div>
      <button class="btn btn-ghost" onclick="saveProject()">保存</button>
      <button class="btn btn-primary" onclick="exportProjectJson()">导出配置</button>
      <button class="btn btn-success" onclick="generateGameZip()">打包放置游戏</button>
    </div>
  </header>
  <div class="toolbar">
    <div class="toolbar-left">
      <button class="btn btn-default" onclick="newProject()">新建项目</button>
      <button class="btn btn-default" onclick="importProject()">导入项目</button>
    </div>
    <div class="toolbar-right" id="toolbarRight"></div>
  </div>
  <div class="main">
    <aside class="sidebar">
      <div class="sidebar-search">
        <input type="text" id="moduleSearch" placeholder="搜索模块 / 资源" />
      </div>
      <div class="sidebar-menu" id="sidebarMenu"></div>
    </aside>
    <section class="editor" id="editor">
      <div class="editor-header">
        <div class="editor-title">欢迎使用 Game Studio</div>
        <div></div>
      </div>
      <div class="editor-body">
        <div class="empty-state">
          <div class="big-icon">🎮</div>
          <p>点击上方【新建项目】开始你的游戏制作之旅</p>
        </div>
      </div>
    </section>
    <aside class="right-panel">
      <div class="panel preview-panel">
        <div class="panel-header">
          <div class="panel-title">实时预览</div>
        </div>
        <div class="panel-body" id="previewBox">
          <div class="empty">选择资源后预览效果</div>
        </div>
      </div>
      <div class="panel log-panel">
        <div class="panel-header">
          <div class="panel-title">系统日志</div>
          <button class="btn-link" onclick="clearLog()">清空</button>
        </div>
        <div class="panel-body log-body" id="logBox">
[系统] Game Studio 编辑器已加载
        </div>
      </div>
    </aside>
  </div>
  <div class="modal" id="newProjectModal">
    <div class="modal-card">
      <div class="modal-header">
        <div class="modal-title">新建游戏项目</div>
        <button class="icon-btn" onclick="closeModal()">
          <svg viewBox="0 0 24 24" width="16" height="16">
            <path d="M6 6l12 12M18 6L6 18" stroke="currentColor" stroke-width="2" stroke-linecap="round" />
          </svg>
        </button>
      </div>
      <div class="modal-body">
        <div class="form-row">
          <label>项目名称</label>
          <input type="text" id="projName" placeholder="例如：我的冒险小游戏" />
        </div>
        <div class="form-row">
          <label>游戏类型</label>
          <select id="projType">
            <option value="idle">放置挂机游戏</option>
            <option value="rpg">角色扮演 RPG</option>
            <option value="action">横版动作游戏</option>
            <option value="turn">回合制游戏</option>
          </select>
        </div>
        <div class="form-row">
          <label>项目描述</label>
          <textarea id="projDesc" rows="4" placeholder="描述游戏玩法、特色和目标..."></textarea>
        </div>
      </div>
      <div class="modal-footer">
        <button class="btn btn-default" onclick="closeModal()">取消</button>
        <button class="btn btn-primary" onclick="confirmNewProject()">创建项目</button>
      </div>
    </div>
  </div>
</div>

<script src="js/core.js"></script>
<script src="js/main.js"></script>
</body>
</html>
