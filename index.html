<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<title>游戏编辑器</title>
<link rel="stylesheet" href="css/style.css">
</head>
<body>
<div class="app-container">
  <!-- 顶部步骤导航 -->
  <header class="top-step-nav">
    <div class="step-item active" data-step="1">1 新建项目</div>
    <div class="step-item" data-step="2">2 游戏基础配置</div>
    <div class="step-item" data-step="3">3 游戏数据编辑</div>
    <div class="step-item" data-step="4">4 地图场景编辑</div>
    <div class="step-item" data-step="5">5 动画资源制作</div>
    <div class="step-item" data-step="6">6 导出游戏项目</div>
  </header>

  <!-- 顶部操作按钮 -->
  <div class="top-action-bar">
    <button class="btn-blue" id="btnNewProject">新建项目</button>
    <button class="btn" id="btnImportProject">导入项目</button>
    <button class="btn-orange" id="btnSaveProject">保存项目</button>
    <button class="btn-blue" id="btnExportConfig">导出配置</button>
    <button class="btn-green" id="btnBuildGame">打包导出完整游戏</button>
  </div>

  <div class="main-wrap">
    <!-- 左侧侧边栏（动态渲染） -->
    <aside class="left-sidebar" id="leftSidebar">
      <!-- JS根据当前step动态渲染菜单 -->
    </aside>

    <!-- 中间主编辑区 -->
    <main class="editor-main" id="editorMain">
      <!-- JS根据当前step渲染对应编辑面板 -->
    </main>

    <!-- 右侧预览面板 -->
    <aside class="right-preview">
      <h3>实时预览</h3>
      <div class="preview-box"></div>
      <div class="system-log">
        <p>系统日志</p>
      </div>
    </aside>
  </div>
</div>

<script src="js/main.js"></script>
</body>
</html>
